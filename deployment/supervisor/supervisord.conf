[supervisord]
nodaemon=true
user=root
; Send supervisord's own diagnostics to stderr so they appear in `docker logs`.
logfile=/dev/stderr
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:backend]
command=uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --workers 1
directory=/app
user=appuser
autostart=true
autorestart=true
; ``/dev/fd/1`` and ``/dev/fd/2`` route the program's stdout/stderr to the
; container's stdout/stderr (supervisord runs as PID 1), so the output is
; available via ``docker logs``. ``maxbytes=0`` disables supervisord's log
; rotation, which doesn't work on non-seekable pseudo-files.
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PATH="/usr/local/bin:/usr/bin:/bin",PYTHONPATH="/app:/app/backend",HOME="/home/appuser"
stopasgroup=true
killasgroup=true

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[group:webapp]
programs=backend,nginx

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
